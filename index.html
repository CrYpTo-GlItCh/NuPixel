<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NuPixel | Next-Gen FiveM Roleplay Community</title>
    <!-- CSS and icon dependencies omitted for brevity; see project files -->
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="container">
        <header class="hero-section">
            <h1 class="logo">NU<span class="highlight">PIXEL</span></h1>
            <p class="tagline">WELCOME TO THE FUTURE OF ROLEPLAY</p>
        </header>

        <section class="grid-layout">
            <!-- Discord, Server Connection, and Shop cards -->
            <a href="cfx://connect/3yagxxz" class="card cfx-card">
                <h3>Play NuPixel</h3>
                <div class="player-count-badge">
                    <span id="player-status">Syncing API...</span>
                </div>
            </a>
        </section>

        <!-- Donation and crypto wallet sections omitted for brevity -->
    </div>

    <script>
        async function updateFiveMPlayers() {
            const serverId = '3yagxxz';
            const statusElement = document.getElementById('player-status');
            try {
                const response = await fetch(`https://fivem.net{serverId}`, {
                    headers: { 'User-Agent': 'NuPixel-Web-Portal' }
                });
                if (!response.ok) throw new Error('Cfx directory network exception');
                const payload = await response.json();
                if (payload && payload.data) {
                    const activeCount = payload.data.clients || 0;
                    const maxCount = payload.data.vars.sv_maxclients || 32;
                    statusElement.innerText = `ONLINE: ${activeCount} / ${maxCount}`;
                } else {
                    statusElement.innerText = "OFFLINE";
                }
            } catch (err) {
                statusElement.innerText = "SERVER ONLINE";
            }
        }
        updateFiveMPlayers();
        setInterval(updateFiveMPlayers, 60000);
    </script>
</body>
</html>
